[package]
name = "ksec"
version = "0.1.4"
edition = "2024"
description = "Self-contained security scanner CLI — secrets, deps, supply chain, SAST, obfuscation"
license = "MIT"
repository = "https://github.com/dev-toolings/ksec"
homepage = "https://github.com/dev-toolings/ksec"
keywords = ["security", "scanner", "secrets", "sast", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
indicatif = "0.17"
regex = "1"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
